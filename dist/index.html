    <!-- Performance Optimization - Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Inter, loaded without blocking the first paint.
         The preload starts the request at the same priority a stylesheet link
         would, then the onload handler promotes it to an applied stylesheet.
         A plain <link rel="stylesheet"> here held up rendering until Google
         Fonts answered; with display=swap the text was going to reflow anyway,
         so blocking bought nothing. noscript covers scripting-off. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VE67JBGBKL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VE67JBGBKL');
    </script>

    <!-- Shell title only.
         Every other SEO tag is owned by src/components/SEO.jsx and rendered
         per page through react-helmet.

         There used to be a full set here - description, keywords, robots,
         canonical, the Open Graph block and the Twitter block. Helmet does not
         remove tags it did not create, so it appended its own alongside them
         and every page shipped two of each. The canonical was the damaging
         one: all 91 pages declared both their own URL and the site root as
         canonical, and Google's documented response to conflicting rel=canonical
         is to disregard all of them. A crawler that instead takes the first
         would fold the entire site onto the home page.

         <title> is the exception and stays: there is only ever one title
         element, so Helmet replaces it cleanly, and it gives the pre-JS
         document something sensible. Do not add page-level meta tags here. -->
    <title>Iowa Print Solutions | PaperCut, uniFLOW &amp; Vasion Print for Iowa Organizations</title>

    <!--
      A SoftwareApplication block was removed from here.

      It described a product called "Iowa Copier Security Solutions" that does
      not exist - this site is a resource and reseller site, not a software
      vendor - and attached an invented 4.8/127 AggregateRating plus an
      AggregateOffer with $3-$8 pricing that appears nowhere on the site.

      Do not reinstate. Ratings require real, on-page, independently collected
      reviews (see docs/SEO-GEO-STRATEGY.md), and Product/Offer markup must
      reflect prices a visitor can actually see. The Organization and
      LocalBusiness blocks below are the correct entity markup for this site.
    -->

    </script>

        border-top-color: #2563eb;

        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
